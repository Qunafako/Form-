<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form_Learning</title>
    <link rel="stylesheet" href="LEARNINGlanjut.css">
</head>
<body>
    <div class="form">
  <h3 class="title">Coding Competition <br> Enrollment 2021</h3>
  <form action="result.html" target="blank" method="GET" autocomplete="on" novalidate>
    <input type="text" name="name" value="Halo" readonly>
    <label for="name">Name</label>    
    <input type="text" name="language" placeholder="Aiko Qurrota A'yun" autofocus required><br>
    <label for="email">Email</label>
    <input type="text" name="language" placeholder="aikoqurrotaayun@gmail.com" required><br>
    <label for="address">Address</label>
    <textarea id="address" name="address" cols="30" rows="10" required></textarea><br>
    <label for="phone">Phone Number</label>
    <input type="text" id="phone" name="phone" required>
    <label for="Age">Age</label>
    <input id="Age" type="number" name="Age" min="5"required> <br>
    <label for="radio">Woman</label>
    <input id="radio" type="radio" name="Gender" value="Wman"> 
    <label for="radio">Men</label>
    <input id="radio" type="radio" name="Gender" value="Men">
    <input id="checkbox" type="checkbox" name="checkbox1" value="student card" required>
    <label for="checkbox">Student card</label>
    <input id="checkbox" type="checkbox" name="checkbox1" value="Biodata" required>
    <label for="checkbox">Biodata</label>
    <input id="checkbox" type="checkbox" name="checkbox1" value="Contact form" required>
    <label for="checkbox">Contract form</label> <br>
    <label for="file>upload File"></label>
    <input id="file" type="file" name="file"> <br>
    <input type="date" name="date" min="2000-01-01" max="2026-10-23">
    <input type="submit" value="Submit" class="submit-btn"><br>
  </form>
</div>
</body>
</html>
